<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda Yarışması: Glamour Sürümü 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="spotlight-layer" class="hidden">
        <div class="spotlight left"></div>
        <div class="spotlight right"></div>
    </div>
    <div id="confetti-container"></div>

    <div id="game-container">
        <!-- 1. Intro Screen -->
        <section id="screen-create-character" class="screen active">
            <h1 class="glam-title">FASHION CITY</h1>
            <p class="subtitle">En gerçekçi moda deneyimi</p>

            <div class="character-preview" id="initial-character-preview">
                <!-- SVG injected via JS -->
            </div>

            <div class="form-group glass-input">
                <input type="text" id="player-name" placeholder="Mankenin adı..." value="Gigi">
            </div>

            <button id="btn-start-game" class="btn-glam">Şehre Adım At</button>
        </section>

        <!-- 2. Theme Announcement Screen -->
        <section id="screen-theme" class="screen">
            <h2 class="glam-title">Yeni Görev</h2>
            <div class="judges">
                <div class="judge"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Cemil&backgroundColor=ffb6c1" class="judge-avatar" alt="Cemil"></div>
                <div class="judge"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Hakan&backgroundColor=b0e0e6" class="judge-avatar" alt="Hakan"></div>
                <div class="judge"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ivana&backgroundColor=ffd700" class="judge-avatar" alt="Ivana"></div>
            </div>
            <div class="theme-display-container">
                <div class="theme-badge">TEMA</div>
                <h3 id="current-theme-display" class="theme-text">...</h3>
            </div>
            <button id="btn-go-street" class="btn-glam" onclick="showScreen('screen-street')">Sokağa Çık</button>
        </section>

        <!-- 3. 2.5D Isometric Street View -->
        <section id="screen-street" class="screen">
            <div class="header-bar glass-header">
                <h2 class="glam-title small">Moda Sokağı</h2>
                <div class="budget-display">💳 <span id="street-budget">1000</span> TL</div>
            </div>

            <div class="isometric-street">
                <div class="iso-grid">
                    <div class="iso-building b-home" onclick="goToBuilding('Ev')">
                        <div class="cube">
                            <div class="face top"></div><div class="face left">Ev</div><div class="face right"></div>
                        </div>
                        <span class="b-label">Ev (Hazırlık)</span>
                    </div>

                    <div class="iso-building b-clothes" onclick="goToBuilding('Kıyafet Dükkanı')">
                        <div class="cube">
                            <div class="face top"></div><div class="face left">Butik</div><div class="face right"></div>
                        </div>
                        <span class="b-label">Kıyafet Dükkanı</span>
                    </div>

                    <div class="iso-building b-hair" onclick="goToBuilding('Kuaför')">
                        <div class="cube">
                            <div class="face top"></div><div class="face left">Kuaför</div><div class="face right"></div>
                        </div>
                        <span class="b-label">Kuaför</span>
                    </div>

                    <div class="iso-building b-acc" onclick="goToBuilding('Aksesuarcı')">
                        <div class="cube">
                            <div class="face top"></div><div class="face left">Takı</div><div class="face right"></div>
                        </div>
                        <span class="b-label">Aksesuarcı</span>
                    </div>

                    <div class="iso-building b-shoes" onclick="goToBuilding('Ayakkabıcı')">
                        <div class="cube">
                            <div class="face top"></div><div class="face left">Ayakkabı</div><div class="face right"></div>
                        </div>
                        <span class="b-label">Ayakkabıcı</span>
                    </div>

                    <div class="iso-building b-podium" onclick="goToBuilding('Yarışma Salonu')">
                        <div class="cube podium-cube">
                            <div class="face top"></div><div class="face left">Podyum</div><div class="face right"></div>
                        </div>
                        <span class="b-label">Yarışma Salonu</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. Shop Screen -->
        <section id="screen-shop" class="screen">
            <div class="header-bar glass-header">
                <h2 class="glam-title small" id="shop-title">Dükkan</h2>
                <div class="budget-display">💳 <span id="shop-budget">1000</span> TL</div>
            </div>

            <div class="shop-items-grid" id="shop-items">
                <!-- Items generated via JS -->
            </div>

            <div class="bottom-actions">
                <button onclick="showScreen('screen-street')" class="btn-secondary">Sokağa Dön</button>
            </div>
        </section>

        <!-- 5. Wardrobe / Home Screen -->
        <section id="screen-wardrobe" class="screen">
            <div class="header-bar glass-header">
                <h2 class="glam-title small">Ev (Hazırlık)</h2>
            </div>

            <div class="wardrobe-layout">
                <div class="character-display" id="wardrobe-character-container">
                    <!-- Advanced SVG injected via JS -->
                </div>

                <div class="inventory-section">
                    <div class="category-filters" id="inventory-categories">
                        <!-- Filters generated via JS -->
                    </div>
                    <div class="inventory-grid" id="inventory-items">
                        <!-- Items generated via JS -->
                    </div>
                </div>
            </div>

            <div class="bottom-actions">
                <button onclick="showScreen('screen-street')" class="btn-secondary">Sokağa Dön</button>
            </div>
        </section>

        <!-- 6. Podium / Runway Screen -->
        <section id="screen-podium" class="screen podium-bg">
            <div class="podium-header">
                <span class="theme-tag" id="podium-theme-display">...</span>
            </div>

            <div class="runway-perspective" id="podium-contestants">
                <!-- Walking mannequins injected here -->
            </div>

            <div class="judging-panel" id="judging-panel">
                <button id="btn-judge" class="btn-glam">Jüri Kararı Başlasın</button>
                <div id="live-scorecards" class="hidden"></div>
            </div>
        </section>

        <!-- 7. Results Screen -->
        <section id="screen-results" class="screen">
            <h2 class="glam-title">Kazanan</h2>
            <div class="winner-showcase" id="winner-announcement"></div>
            <div class="leaderboard-cards" id="leaderboard"></div>
            <button id="btn-next-round" class="btn-glam">Sonraki Tura Geç</button>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
